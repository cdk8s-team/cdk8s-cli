apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: subnetworks.compute.example.com
spec:
  group: compute.example.com
  names:
    kind: Subnetwork
    plural: subnetworks
    singular: subnetwork
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                networkRef:
                  type: string
                  description: Reference to the parent network
                ipRange:
                  type: string
                  description: IP range for the subnetwork
